version: '3.3'
services:
  db:
    image: postgres:14.8-alpine3.18
    environment:
      POSTGRES_USER: leather
      POSTGRES_PASSWORD: ef4t_A7yyU
      POSTGRES_DB: leather_base
      PGDATA: "/var/lib/postgresql/data/pgdata"
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leather -d leather_base"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      postgres -c 'config_file=/var/lib/postgresql/data/postgresql.conf'

  init-db:
    image: postgres:14.8-alpine3.18
    environment:
      POSTGRES_USER: leather
      POSTGRES_PASSWORD: ef4t_A7yyU
      POSTGRES_DB: leather_base
    depends_on:
      - db
    entrypoint: >
      sh -c "
      sleep 20 &&
      until pg_isready -h 192.168.1.5 -p 5432 -U leather; do
        echo \"Waiting for PostgreSQL to be ready...\"
        sleep 2;
      done &&
      psql -h 192.168.1.5 -U leather -d leather_base -c 'CREATE SEQUENCE IF NOT EXISTS product_type_id_seq;' &&
      psql -h 192.168.1.5 -U leather -d leather_base -c 'CREATE TABLE IF NOT EXISTS product_category (id int4 DEFAULT nextval(''product_type_id_seq''::regclass) NOT NULL, name varchar(255) NOT NULL, props json NULL, CONSTRAINT product_type_pkey PRIMARY KEY (id));' &&
      psql -h 192.168.1.5 -U leather -d leather_base -c 'CREATE TABLE IF NOT EXISTS product_status (id serial4 NOT NULL, name varchar(255) NOT NULL, CONSTRAINT product_status_pkey PRIMARY KEY (id));' &&
      psql -h 192.168.1.5 -U leather -d leather_base -c 'CREATE TABLE IF NOT EXISTS products (id serial4 NOT NULL, name varchar(255) NOT NULL, description text NULL, quantity int4 NULL, image text NULL, sale int4 DEFAULT 0 NULL, price int4 NOT NULL, status int4 NULL, category int4 NULL, property json NULL, CONSTRAINT products_pkey PRIMARY KEY (id), CONSTRAINT products_product_status_fk FOREIGN KEY (status) REFERENCES product_status(id), CONSTRAINT products_product_type_fk FOREIGN KEY (category) REFERENCES product_category(id));' &&
      psql -h 192.168.1.5 -U leather -d leather_base -c 'CREATE TABLE IF NOT EXISTS products_property (id serial4 NOT NULL, name varchar(225) NULL, CONSTRAINT products_property_pkey PRIMARY KEY (id));' &&
      psql -h 192.168.1.5 -U leather -d leather_base -c 'CREATE TABLE IF NOT EXISTS users_type (id serial4 NOT NULL, type varchar(225) NULL, CONSTRAINT users_type_pkey PRIMARY KEY (id));' &&
      psql -h 192.168.1.5 -U leather -d leather_base -c 'CREATE TABLE IF NOT EXISTS users (id serial4 NOT NULL, firstname varchar(255) NULL, lastname varchar(255) NULL, username varchar(255) NOT NULL, type int4 NOT NULL, email varchar(255) NULL, password varchar(255) NOT NULL, phone bigint NOT NULL, wishlist int4 NULL, cart int4 NULL, CONSTRAINT users_pkey PRIMARY KEY (id), CONSTRAINT users_users_type_fk FOREIGN KEY (type) REFERENCES users_type(id));'
      "

  leather-shop:
    container_name: "leather-shop"
    image: leather-shop
    restart: on-failure
    ports:
      - "8089:8089"
    stdin_open: true
    tty: true
    depends_on:
      - db
      - init-db
    environment:
      LEATHER_APP_PORT: 8089
      LEATHER_DB_HOST: 192.168.1.5
      LEATHER_DB_PORT: 5432
      LEATHER_DB_USER: leather
      LEATHER_DB_PASSWORD: ef4t_A7yyU
      LEATHER_DB_DATABASE: leather_base
      JWT_SECRET: zoVqwG_6p7
      JWT_ACCESS_TTL: 20
      JWT_REFRESH_TTL: 90

volumes:
  habrdb-data:




