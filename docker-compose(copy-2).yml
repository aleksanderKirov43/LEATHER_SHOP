version: '3'
services:
  db:
    image: postgres:14.8-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: leather
      POSTGRES_PASSWORD: qwerty12345
      POSTGRES_DB: leather_base
      PGDATA: "/var/lib/postgresql/data/pgdata"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leather -d leather_base"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - leather_net

  leather-shop:
    container_name: leather-shop
    image: leather-shop
    ports:
      - "8089:8089"
    stdin_open: true
    tty: true
    depends_on:
      - db
    environment:
      LEATHER_APP_PORT: 8089
      LEATHER_DB_HOST: postgres_db
      LEATHER_DB_PORT: 5432
      LEATHER_DB_USER: leather
      LEATHER_DB_PASSWORD: qwerty12345
      LEATHER_DB_DATABASE: leather_base
      JWT_SECRET: zoVqwG_6p7
      JWT_ACCESS_TTL: 20
      JWT_REFRESH_TTL: 90
    networks:
      - leather_net

volumes:
  postgres_data:

networks:
  leather_net: